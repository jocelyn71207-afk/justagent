<h2>CreateKnowledgeWizardModal — FILE 區塊改動</h2>
<p class="subtitle">左：上傳新檔案（含提示文字 + 次要按鈕）　右：已從共用庫選取後的狀態</p>

<div class="split" style="max-width:760px;margin:0 auto;">

  <!-- Left: Upload state -->
  <div class="mockup">
    <div class="mockup-header">上傳新檔案</div>
    <div class="mockup-body" style="padding:14px;">

      <!-- Source type cards -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;">
        <div style="border:2px solid #2563eb;background:#eff6ff;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:16px;">📄</div>
          <div style="font-size:10px;font-weight:600;color:#1d4ed8;">上傳檔案</div>
        </div>
        <div style="border:1px solid #e2e8f0;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:16px;">🔌</div>
          <div style="font-size:10px;font-weight:600;color:#374151;">API 來源</div>
        </div>
        <div style="border:1px solid #e2e8f0;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:16px;">✏️</div>
          <div style="font-size:10px;font-weight:600;color:#374151;">手動輸入</div>
        </div>
      </div>

      <!-- Upload zone -->
      <div style="border:2px dashed #93c5fd;border-radius:8px;padding:20px;text-align:center;margin-bottom:8px;">
        <div style="font-size:22px;margin-bottom:4px;">☁️</div>
        <div style="font-size:11px;font-weight:500;color:#2563eb;">拖曳檔案至此或點擊選取</div>
        <div style="font-size:10px;color:#6b7280;margin-top:3px;">支援 PDF、DOCX、XLSX，最大 50MB</div>
      </div>

      <!-- ★ NEW: hint text -->
      <div style="font-size:10px;color:#64748b;text-align:center;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:4px;">
        <span>ℹ️</span>
        <span>上傳的檔案將同時儲存至共用檔案管理</span>
      </div>

      <!-- ★ NEW: separator + secondary button -->
      <div style="text-align:center;margin-bottom:10px;">
        <span style="font-size:10px;color:#94a3b8;">— 或 —</span>
      </div>
      <div style="text-align:center;margin-bottom:14px;">
        <button class="mock-button" style="background:#f8fafc;color:#374151;border:1px solid #cbd5e1;font-size:11px;padding:5px 14px;">
          🗄 從共用檔案管理選取
        </button>
      </div>

      <!-- Category + Tags -->
      <div style="margin-bottom:8px;">
        <div style="font-size:10px;font-weight:600;margin-bottom:3px;color:#374151;">分類 *</div>
        <select class="mock-input" style="width:100%;font-size:11px;">
          <option>選擇分類...</option>
        </select>
      </div>
      <div style="margin-bottom:14px;">
        <div style="font-size:10px;font-weight:600;margin-bottom:3px;color:#374151;">標籤（選填）</div>
        <input class="mock-input" style="width:100%;font-size:11px;" placeholder="輸入後按 Enter 新增" />
      </div>

      <div style="display:flex;justify-content:flex-end;gap:6px;">
        <button class="mock-button" style="font-size:11px;background:#f1f5f9;color:#374151;border:1px solid #e2e8f0;">取消</button>
        <button class="mock-button" style="font-size:11px;background:#cbd5e1;color:#94a3b8;border:none;" disabled>⬆ 上傳並開始處理</button>
      </div>
    </div>
  </div>

  <!-- Right: After picked from library -->
  <div class="mockup">
    <div class="mockup-header">已選取共用庫檔案</div>
    <div class="mockup-body" style="padding:14px;">

      <!-- Source type cards -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;">
        <div style="border:2px solid #2563eb;background:#eff6ff;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:16px;">📄</div>
          <div style="font-size:10px;font-weight:600;color:#1d4ed8;">上傳檔案</div>
        </div>
        <div style="border:1px solid #e2e8f0;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:16px;">🔌</div>
          <div style="font-size:10px;font-weight:600;color:#374151;">API 來源</div>
        </div>
        <div style="border:1px solid #e2e8f0;border-radius:8px;padding:8px;text-align:center;">
          <div style="font-size:16px;">✏️</div>
          <div style="font-size:10px;font-weight:600;color:#374151;">手動輸入</div>
        </div>
      </div>

      <!-- ★ Selected file display (replaces upload zone) -->
      <div style="border:2px solid #16a34a;background:#f0fdf4;border-radius:8px;padding:16px;text-align:center;margin-bottom:8px;">
        <div style="font-size:22px;margin-bottom:4px;">✅</div>
        <div style="font-size:11px;font-weight:600;color:#15803d;">2024年Q1產品手冊.pdf</div>
        <div style="font-size:10px;color:#6b7280;margin-top:3px;">來自共用檔案管理</div>
        <button style="font-size:10px;color:#6b7280;background:none;border:none;cursor:pointer;text-decoration:underline;margin-top:4px;">更換</button>
      </div>

      <!-- No hint text here (not uploading) -->
      <div style="height:14px;"></div>

      <!-- Category + Tags -->
      <div style="margin-bottom:8px;">
        <div style="font-size:10px;font-weight:600;margin-bottom:3px;color:#374151;">分類 *</div>
        <select class="mock-input" style="width:100%;font-size:11px;">
          <option>產品文件</option>
        </select>
      </div>
      <div style="margin-bottom:14px;">
        <div style="font-size:10px;font-weight:600;margin-bottom:3px;color:#374151;">標籤（選填）</div>
        <div style="border:1px solid #e2e8f0;border-radius:4px;padding:4px 8px;font-size:11px;display:flex;gap:4px;align-items:center;">
          <span style="background:#dbeafe;color:#1d4ed8;padding:1px 6px;border-radius:10px;font-size:10px;">Q1 ✕</span>
          <input style="border:none;outline:none;font-size:11px;flex:1;" placeholder="" />
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:6px;">
        <button class="mock-button" style="font-size:11px;background:#f1f5f9;color:#374151;border:1px solid #e2e8f0;">取消</button>
        <button class="mock-button" style="font-size:11px;background:#2563eb;color:#fff;border:none;">✏ 建立草稿並編輯</button>
      </div>
    </div>
  </div>

</div>
