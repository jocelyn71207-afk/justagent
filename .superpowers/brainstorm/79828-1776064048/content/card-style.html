<h2>垃圾桶卡片視覺風格</h2>
<p class="subtitle">你希望垃圾桶的專案卡片，視覺上要和一般專案有所區別嗎？</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="
        background: #f5f5f5;
        border-radius: 12px;
        height: 160px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        position: relative;
        overflow: hidden;
      ">
        <!-- 灰階卡片示意 -->
        <div style="
          position: absolute; inset: 0;
          background: linear-gradient(135deg, #c8c8c8 0%, #e0e0e0 100%);
          border-radius: 12px;
          filter: grayscale(1);
          opacity: 0.6;
        "></div>
        <div style="position: relative; z-index: 1; text-align: center;">
          <div style="font-size: 32px;">🗑️</div>
          <div style="font-size: 12px; color: #666; margin-top: 4px;">卡片圖片（灰階淡化）</div>
        </div>
        <div style="
          position: absolute;
          top: 10px; right: 10px;
          background: #e53935;
          color: white;
          border-radius: 12px;
          padding: 2px 8px;
          font-size: 11px;
          font-weight: 700;
          z-index: 2;
        ">剩餘 3 天</div>
      </div>
      <div style="padding: 12px 12px 0; font-size: 14px; font-weight: 600; color: #999;">專案名稱</div>
      <div style="padding: 4px 12px 12px; font-size: 12px; color: #aaa;">Lucas 刪除・剩餘 3 天</div>
    </div>
    <div class="card-body">
      <h3>A｜灰階淡化 + 到期標籤</h3>
      <p>卡片圖片轉為灰階並降低透明度，頂角顯示紅色「剩餘天數」標籤，強調已刪除狀態</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="
        background: #f5f5f5;
        border-radius: 12px;
        height: 160px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        position: relative;
        overflow: hidden;
      ">
        <!-- 彩色卡片示意 -->
        <div style="
          position: absolute; inset: 0;
          background: linear-gradient(135deg, #7bc67e 0%, #43a047 100%);
          border-radius: 12px;
          opacity: 0.85;
        "></div>
        <div style="position: relative; z-index: 1; text-align: center;">
          <div style="font-size: 12px; color: rgba(255,255,255,0.9);">卡片圖片（保持彩色）</div>
        </div>
        <!-- 天數 badge 在 footer -->
      </div>
      <div style="padding: 12px 12px 0; font-size: 14px; font-weight: 600; color: #232735;">專案名稱</div>
      <div style="padding: 4px 12px 12px; display: flex; align-items: center; gap: 6px;">
        <span style="
          background: #ffeaea;
          color: #e53935;
          border-radius: 10px;
          padding: 2px 8px;
          font-size: 11px;
          font-weight: 700;
        ">⏳ 剩餘 3 天</span>
        <span style="font-size: 12px; color: #aaa;">Lucas 刪除</span>
      </div>
    </div>
    <div class="card-body">
      <h3>B｜保持彩色 + footer 強化</h3>
      <p>卡片圖片保持原色，底部加入彩色「剩餘天數」badge 與刪除者資訊，更新鮮活潑</p>
    </div>
  </div>
</div>
